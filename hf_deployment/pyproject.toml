[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context_router"
version = "0.1.0"
description = "Context Router environment for OpenEnv"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[tool.setuptools]
include-package-data = true
packages = ["server", "graders", "tasks", "baseline"]

[tool.setuptools.package-dir]
"server" = "server"
"graders" = "graders"
"tasks" = "tasks"
"baseline" = "baseline"
