# openenv.yaml — Context Router Environment Manifest
#
# RULE: Always commit openenv.yaml + models.py in the SAME commit.
# RULE: Run `openenv validate --verbose` immediately after any edit (must show 0 errors).
# RULE: Never edit this file alone — both teammates must be present.
#
# Sacred class names (must match models.py exactly):
#   action:      CacheAction
#   observation: CacheObservation

spec_version: 1
name: context_router
type: space
runtime: fastapi
app: server.app:app
port: 8000

tasks:
  - name: easy
    difficulty: easy
    description: "Prevent OOM by evicting the lowest-attention KV-cache block each step (binary tactic: evict | retain)"
  - name: medium
    difficulty: medium
    description: "Manage mixed workloads using three tactics (evict, retain, compress) across variable VRAM pressure"
  - name: hard
    difficulty: hard
    description: "Prioritised multi-block cache management under tight VRAM constraints with the full tactic set"

action_schema:
  type: object
  required:
    - target_block_id
    - tactic
  properties:
    target_block_id:
      type: integer
      description: "ID of the memory block to act on"
    tactic:
      type: string
      enum: ["evict", "retain", "compress"]
      description: "Eviction tactic to apply"
    priority:
      type: integer
      minimum: 1
      maximum: 5
      description: "Optional hard-task priority signal (1=lowest importance, 5=highest)"

observation_schema:
  type: object
  required:
    - vram_utilization
    - incoming_tokens
    - memory_blocks
    - oom_triggered
    - message
  properties:
    vram_utilization:
      type: number
      format: float
      minimum: 0.0
      maximum: 1.0
      description: "Current VRAM utilisation as fraction of total capacity (0.0–1.0)"
    incoming_tokens:
      type: integer
      minimum: 0
      description: "Number of new tokens arriving this step"
    memory_blocks:
      type: array
      description: "Snapshot of current memory blocks (List[MemoryBlockInfo])"
      items:
        type: object
        required:
          - block_id
          - block_type
          - attention_score
          - token_count
          - age
        properties:
          block_id:
            type: integer
            description: "Unique block identifier"
          block_type:
            type: string
            description: "Block type (e.g. kv_cache, activations)"
          attention_score:
            type: number
            format: float
            description: "Attention weight for this block (0.0–1.0)"
          token_count:
            type: integer
            description: "Number of tokens stored in this block"
          age:
            type: integer
            description: "Steps since this block was last accessed"
    oom_triggered:
      type: boolean
      description: "Whether an out-of-memory event occurred this step"
    message:
      type: string
      description: "Human-readable description of this step's outcome"
