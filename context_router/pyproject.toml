[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-context_router"
version = "0.1.0"
description = "Context Router environment for OpenEnv"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m context_router.server.app
server = "context_router.server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "context_router",
    "context_router.server",
    "context_router.graders",
    "context_router.tasks",
    "context_router.baseline",
]

[tool.setuptools.package-dir]
"context_router" = "."
"context_router.server" = "server"
"context_router.graders" = "graders"
"context_router.tasks" = "tasks"
"context_router.baseline" = "baseline"
